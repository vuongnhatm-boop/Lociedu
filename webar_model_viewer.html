<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#070b18">
    <meta name="description" content="Xem mô hình 3D trong không gian thực bằng camera điện thoại — WebXR, ARCore, ARKit.">
    <title>WebAR · Xem mô hình 3D trong không gian của bạn</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://modelviewer.dev" crossorigin>

    <style>
        :root {
            --bg: #070b18;
            --ink: #eaf0ff;
            --muted: #9aa8c7;
            --brand: #5b8cff;
            --brand-2: #22d3ee;
            --card: rgba(14, 21, 40, .72);
            --stroke: rgba(148, 178, 255, .22);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--ink);
            font-family: "Outfit", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
        }

        body {
            background:
                radial-gradient(1200px 700px at 50% -10%, rgba(91, 140, 255, .28), transparent 60%),
                radial-gradient(900px 600px at 110% 110%, rgba(34, 211, 238, .16), transparent 55%),
                var(--bg);
        }

        .app {
            position: fixed;
            inset: 0;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        model-viewer {
            flex: 1;
            width: 100%;
            min-height: 0;
            background: transparent;
            --poster-color: transparent;
            --progress-bar-color: transparent;
            --progress-mask: transparent;
            --progress-bar-height: 0;
        }

        /* Ẩn nút AR mặc định — dùng CTA thiết kế riêng ở dưới */
        #native-ar-slot { display: none; }

        .topbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: calc(14px + var(--safe-top)) 16px 14px;
            pointer-events: none;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 999px;
            background: var(--card);
            border: 1px solid var(--stroke);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
        }

        .brand svg { width: 20px; height: 20px; color: var(--brand-2); }

        .brand strong {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .3px;
        }

        .brand span {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: .4px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 13px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 600;
            color: #cfe0ff;
            background: var(--card);
            border: 1px solid var(--stroke);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            white-space: nowrap;
        }

        .chip i {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 10px #34d399;
        }

        .chip.warn i { background: #fbbf24; box-shadow: 0 0 10px #fbbf24; }

        .hint {
            position: absolute;
            left: 50%;
            top: calc(74px + var(--safe-top));
            transform: translateX(-50%);
            z-index: 4;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: calc(100% - 32px);
            padding: 9px 14px;
            border-radius: 999px;
            font-size: 12.5px;
            color: #dbe6ff;
            background: rgba(7, 11, 24, .55);
            border: 1px solid rgba(148, 178, 255, .16);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-align: center;
            transition: opacity .25s ease, transform .25s ease;
        }

        .hint.hide { opacity: 0; transform: translate(-50%, -8px); pointer-events: none; }

        .bottom {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 6;
            padding: 18px 16px calc(18px + var(--safe-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            background: linear-gradient(to top, rgba(7, 11, 24, .92), rgba(7, 11, 24, .55) 55%, transparent);
        }

        .meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            font-size: 11.5px;
            color: var(--muted);
        }

        .meta b { color: #dbe6ff; font-weight: 600; }

        .meta .dot { opacity: .45; }

        .ar-cta {
            width: min(520px, 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 17px 22px;
            border: 0;
            border-radius: 18px;
            color: #fff;
            font: inherit;
            font-size: 16.5px;
            font-weight: 800;
            letter-spacing: .2px;
            cursor: pointer;
            background: linear-gradient(120deg, #5b8cff, #22d3ee 90%);
            box-shadow: 0 18px 45px rgba(50, 110, 255, .48), inset 0 1px 0 rgba(255, 255, 255, .35);
            transition: transform .15s ease, filter .2s ease, box-shadow .2s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .ar-cta:active { transform: scale(.975); }
        .ar-cta:disabled { filter: grayscale(.35) brightness(.8); cursor: progress; }
        .ar-cta svg { width: 23px; height: 23px; flex: none; }

        .ar-cta .tag {
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 4px 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, .2);
            border: 1px solid rgba(255, 255, 255, .3);
        }

        .loader {
            position: absolute;
            inset: 0;
            z-index: 8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: rgba(7, 11, 24, .9);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: opacity .4s ease;
        }

        .loader.done { opacity: 0; pointer-events: none; }

        .loader .ring {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 3px solid rgba(148, 178, 255, .18);
            border-top-color: var(--brand-2);
            animation: spin .9s linear infinite;
        }

        .loader .track {
            width: min(260px, 70vw);
            height: 5px;
            border-radius: 999px;
            background: rgba(148, 178, 255, .16);
            overflow: hidden;
        }

        .loader .track i {
            display: block;
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--brand), var(--brand-2));
            transition: width .2s ease;
        }

        .loader small { font-size: 12.5px; color: var(--muted); letter-spacing: .3px; }

        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(120px + var(--safe-bottom));
            transform: translate(-50%, 16px);
            z-index: 20;
            max-width: min(440px, calc(100% - 32px));
            padding: 13px 16px;
            border-radius: 14px;
            font-size: 13.5px;
            line-height: 1.45;
            color: #eaf0ff;
            background: rgba(17, 25, 46, .96);
            border: 1px solid var(--stroke);
            box-shadow: 0 16px 40px rgba(0, 0, 0, .5);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease, transform .25s ease;
        }

        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        .error-card {
            position: absolute;
            inset: auto 16px calc(110px + var(--safe-bottom));
            z-index: 15;
            display: none;
            padding: 16px 18px;
            border-radius: 16px;
            background: rgba(60, 18, 30, .95);
            border: 1px solid rgba(255, 120, 150, .35);
            font-size: 13.5px;
            line-height: 1.5;
        }

        .error-card.show { display: block; }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 380px) {
            .ar-cta { font-size: 15px; padding: 15px 16px; }
            .brand span { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .loader .ring { animation: none; }
            .ar-cta, .hint, .toast { transition: none; }
        }
    </style>
</head>

<body>
    <div class="app">
        <model-viewer id="mv" alt="Mô hình phi hành gia 3D" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
            loading="eager" ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="auto"
            xr-environment camera-controls touch-action="pan-y" shadow-intensity="1.4" shadow-softness="0.75"
            environment-image="neutral" exposure="1.05" auto-rotate auto-rotate-delay="2200"
            rotation-per-second="16deg" interaction-prompt="auto">
            <button slot="ar-button" id="native-ar-slot" tabindex="-1" aria-hidden="true"></button>
        </model-viewer>

        <header class="topbar">
            <div class="brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Z" />
                    <path d="M12 12 4 7.5M12 12l8-4.5M12 12v9" />
                </svg>
                <div>
                    <strong>WebAR Studio</strong><br>
                    <span>model-viewer · Google</span>
                </div>
            </div>
            <div class="chip" id="statusChip"><i></i><span id="statusText">World Tracking</span></div>
        </header>

        <div class="hint" id="hint">Kéo để xoay mô hình 3D · Bấm nút bên dưới để ghim vào không gian thật</div>

        <div class="loader" id="loader">
            <div class="ring" aria-hidden="true"></div>
            <div class="track" aria-hidden="true"><i id="progressBar"></i></div>
            <small id="loaderText">Đang tải mô hình 3D…</small>
        </div>

        <div class="error-card" id="errorCard"></div>

        <div class="bottom">
            <div class="meta">
                <span><b>World Tracking</b></span><span class="dot">·</span>
                <span>ARCore / ARKit</span><span class="dot">·</span>
                <span>Ghim trên sàn hoặc mặt bàn</span>
            </div>
            <button class="ar-cta" id="arBtn" type="button" aria-label="Xem trong không gian của bạn bằng AR">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Z" />
                    <path d="M12 12 4 7.5M12 12l8-4.5M12 12v9" />
                </svg>
                <span>Xem trong không gian của bạn</span>
                <span class="tag">AR</span>
            </button>
        </div>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <script type="module">
        const VERSIONS = [
            'https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js',
            'https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js'
        ];

        const mv = document.getElementById('mv');
        const arBtn = document.getElementById('arBtn');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loaderText');
        const progressBar = document.getElementById('progressBar');
        const toastEl = document.getElementById('toast');
        const hint = document.getElementById('hint');
        const statusChip = document.getElementById('statusChip');
        const statusText = document.getElementById('statusText');
        const errorCard = document.getElementById('errorCard');

        let toastTimer = null;
        function toast(message, ms = 4200) {
            toastEl.textContent = message;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
        }

        function setStatus(text, warn) {
            statusText.textContent = text;
            statusChip.classList.toggle('warn', !!warn);
        }

        function fail(message) {
            loader.classList.add('done');
            errorCard.textContent = message;
            errorCard.classList.add('show');
            arBtn.disabled = true;
        }

        function isIOS() {
            return /iP(hone|ad|od)/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        }

        async function loadLibrary() {
            for (const url of VERSIONS) {
                try {
                    await import(url);
                    if (window.customElements && customElements.get('model-viewer')) return true;
                } catch (err) {
                    console.warn('[WebAR] Không tải được model-viewer từ', url, err);
                }
            }
            return false;
        }

        (async () => {
            const ok = await loadLibrary();
            if (!ok) {
                fail('Không tải được thư viện model-viewer. Kiểm tra kết nối mạng rồi tải lại trang.');
                return;
            }

            mv.addEventListener('progress', (e) => {
                const p = Math.round((e.detail.totalProgress || 0) * 100);
                progressBar.style.width = p + '%';
                loaderText.textContent = p < 100 ? `Đang tải mô hình… ${p}%` : 'Đang dựng cảnh…';
            });

            let ready = false;
            function markReady() {
                if (ready) return;
                ready = true;
                progressBar.style.width = '100%';
                loader.classList.add('done');
                setStatus(mv.canActivateAR ? 'AR sẵn sàng' : 'Chế độ 3D', !mv.canActivateAR);
            }

            mv.addEventListener('load', markReady);

            // Một số trình duyệt/phiên bản không phát sự kiện "load" khi tab bị ẩn.
            const readyPoll = setInterval(() => {
                if (mv.loaded) {
                    markReady();
                    clearInterval(readyPoll);
                }
            }, 300);

            mv.addEventListener('error', () => {
                fail('Không tải được mô hình 3D. Kiểm tra lại đường dẫn "src" hoặc quyền truy cập tệp.');
            });

            mv.addEventListener('ar-status', (e) => {
                const s = e.detail.status;
                if (s === 'session-started') {
                    setStatus('AR đang chạy');
                    arBtn.disabled = true;
                    hint.classList.add('hide');
                    toast('Di chuyển điện thoại chậm để quét mặt phẳng, rồi chạm để ghim mô hình.');
                } else if (s === 'object-placed') {
                    toast('Đã ghim mô hình. Quay camera đi chỗ khác rồi quay lại — mô hình vẫn đứng đúng chỗ.');
                } else if (s === 'failed') {
                    setStatus('AR lỗi', true);
                    arBtn.disabled = false;
                    toast('AR không khởi động được. Cần ARCore (Android) / ARKit (iPhone) và trang chạy qua HTTPS.');
                } else if (s === 'not-presenting') {
                    setStatus(mv.canActivateAR ? 'AR sẵn sàng' : 'Chế độ 3D', !mv.canActivateAR);
                    arBtn.disabled = false;
                    hint.classList.remove('hide');
                }
            });

            mv.addEventListener('ar-tracking', (e) => {
                if (e.detail.status === 'not-tracking') {
                    setStatus('Đang tìm mặt phẳng', true);
                } else {
                    setStatus('Đã bám mặt phẳng');
                }
            });

            arBtn.addEventListener('click', async () => {
                if (!mv.loaded) {
                    toast('Mô hình đang tải, chờ một chút nhé…');
                    return;
                }
                if (!mv.canActivateAR) {
                    if (isIOS()) {
                        toast('iPhone/iPad: mở trang bằng Safari (iOS 12+) qua HTTPS để dùng AR Quick Look.');
                    } else {
                        toast('Thiết bị/trình duyệt này chưa hỗ trợ AR. Hãy dùng Chrome trên Android (có ARCore) hoặc Safari trên iPhone.');
                    }
                    return;
                }
                arBtn.disabled = true;
                try {
                    await mv.activateAR();
                } catch (err) {
                    console.error('[WebAR] activateAR lỗi:', err);
                    toast('Không mở được AR. Hãy thử lại bằng Chrome/Safari và kết nối HTTPS.');
                } finally {
                    arBtn.disabled = false;
                }
            });

            // Nếu sau 12s chưa có sự kiện load thì báo lỗi mạng thay vì quay mãi.
            setTimeout(() => {
                if (!mv.loaded && !loader.classList.contains('done')) {
                    loaderText.textContent = 'Mô hình tải lâu hơn bình thường — kiểm tra kết nối mạng…';
                }
            }, 12000);
        })();
    </script>
</body>

</html>
