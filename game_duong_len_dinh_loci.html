<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đường Lên Đỉnh Loci · Đấu Trường 4 Thí Sinh</title>
    <meta name="description" content="Đấu trường tri thức 4 người chơi theo format Đường Lên Đỉnh Olympia: Khởi động, Vượt chướng ngại vật, Tăng tốc, Về đích và Lễ trao Vòng nguyệt quế Loci.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100%;
            background: #020617;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }
        /* Top back bar */
        .olympia-nav-bar {
            position: fixed;
            top: 14px;
            left: 16px;
            z-index: 2000000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .olympia-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 700;
            border: 1.5px solid rgba(56, 189, 248, 0.45);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            transition: all 0.2s;
        }
        .olympia-back-btn:hover {
            background: #0284c7;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="olympia-nav-bar">
        <a href="review.html" class="olympia-back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            <span>Quay lại Trang Ôn Tập</span>
        </a>
    </div>

    <!-- Scripts -->
    <script src="app/loci_account_manager.js" onerror="this.onerror=null;this.src='loci_account_manager.js'"></script>
    <script src="app/loci_students_data.js" onerror="this.onerror=null;this.src='loci_students_data.js'"></script>
    <script src="app/olympia_loci_engine.js" onerror="this.onerror=null;this.src='olympia_loci_engine.js'"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                if (window.OlympiaLociEngine) {
                    window.OlympiaLociEngine.open();
                }
            }, 100);
        });
    </script>
</body>
</html>
