<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Trình Chiếu Slide Cung Điện Ký Ức - LOCI EDU</title>
    <link rel="icon" type="image/png" href="assets/images/logo_loci_edu.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #090d16;
            --bg-surface: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --primary: #0284c7;
            --primary-light: #38bdf8;
            --accent: #06b6d4;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.1);
            --border-active: #38bdf8;
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, var(--bg-deep) 75%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            user-select: none;
        }

        /* TOPBAR NAVIGATION */
        header.slide-header {
            position: sticky;
            top: 0;
            z-index: 100;
            height: 64px;
            padding: 0 20px;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-back-hub {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-glass);
            color: #e2e8f0;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-back-hub:hover {
            background: rgba(2, 132, 199, 0.2);
            border-color: var(--primary-light);
            color: #ffffff;
            transform: translateX(-2px);
        }

        .slide-title-wrap {
            display: flex;
            flex-direction: column;
        }

        .slide-main-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15.5px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .slide-tag {
            font-size: 10.5px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary-light);
            border: 1px solid rgba(56, 189, 248, 0.3);
            text-transform: uppercase;
        }

        .slide-sub-title {
            font-size: 12px;
            color: var(--text-sub);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* COUNTER PILL */
        .page-counter-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(2, 132, 199, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 99px;
            font-size: 13.5px;
            font-weight: 700;
            color: #38bdf8;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }

        .btn-action-tool {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glass);
            color: #f1f5f9;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-action-tool:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .btn-action-primary {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: none;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
        }

        .btn-action-primary:hover {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.5);
        }

        /* MAIN SLIDE VIEWPORT */
        main.presentation-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 20px 10px;
            position: relative;
            max-width: 1440px;
            width: 100%;
            margin: 0 auto;
        }

        .slide-stage-card {
            position: relative;
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
            background: #020617;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .slide-image-element {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: opacity 0.25s ease, transform 0.25s ease;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
        }

        .slide-image-element.loading {
            opacity: 0.3;
            transform: scale(0.99);
        }

        /* NAV OVERLAYS (LEFT / RIGHT) */
        .stage-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            display: grid;
            place-items: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            opacity: 0.85;
        }

        .stage-nav-btn:hover {
            opacity: 1;
            background: var(--primary);
            border-color: var(--primary-light);
            transform: translateY(-50%) scale(1.1);
        }

        .stage-nav-btn:active {
            transform: translateY(-50%) scale(0.96);
        }

        .stage-nav-btn.prev-btn {
            left: 20px;
        }

        .stage-nav-btn.next-btn {
            right: 20px;
        }

        .stage-nav-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* SLIDE CONTROLS BAR */
        .slide-controls-bar {
            width: 100%;
            max-width: 1200px;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            gap: 12px;
            flex-wrap: wrap;
        }

        .hotkey-hints {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-sub);
        }

        .kbd-key {
            padding: 3px 7px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 5px;
            font-family: monospace;
            font-size: 11px;
            color: #f1f5f9;
        }

        .progress-indicator-track {
            flex: 1;
            max-width: 320px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 99px;
            overflow: hidden;
            position: relative;
        }

        .progress-indicator-fill {
            height: 100%;
            width: 8.33%;
            background: linear-gradient(90deg, #38bdf8, #0284c7);
            border-radius: 99px;
            transition: width 0.3s ease;
        }

        /* THUMBNAIL STRIP (BOTTOM DOCK) */
        .thumb-dock-wrap {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid var(--border-glass);
            padding: 12px 20px 16px;
            position: sticky;
            bottom: 0;
            z-index: 90;
        }

        .thumb-strip-scroll {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 6px;
            scroll-behavior: smooth;
        }

        .thumb-strip-scroll::-webkit-scrollbar {
            height: 6px;
        }

        .thumb-strip-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 99px;
        }

        .thumb-strip-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .thumb-card {
            flex: 0 0 140px;
            aspect-ratio: 16 / 9;
            background: #020617;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0.65;
        }

        .thumb-card:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .thumb-card.active {
            opacity: 1;
            border-color: #38bdf8;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
            transform: translateY(-2px);
        }

        .thumb-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .thumb-num {
            position: absolute;
            bottom: 4px;
            left: 4px;
            padding: 2px 6px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            border-radius: 4px;
            font-size: 10.5px;
            font-weight: 700;
            color: #fff;
        }

        /* FULLSCREEN ADJUSTMENT */
        :fullscreen main.presentation-area {
            max-width: 100vw;
            height: 100vh;
            padding: 0;
            justify-content: center;
        }

        :fullscreen .slide-stage-card {
            max-width: 100vw;
            height: 100vh;
            border-radius: 0;
            border: none;
        }

        :fullscreen .thumb-dock-wrap,
        :fullscreen header.slide-header,
        :fullscreen .slide-controls-bar {
            display: none !important;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            header.slide-header {
                padding: 0 12px;
                height: 56px;
            }

            .slide-sub-title,
            .btn-action-tool span,
            .hotkey-hints {
                display: none;
            }

            .stage-nav-btn {
                width: 42px;
                height: 42px;
            }

            .stage-nav-btn.prev-btn { left: 8px; }
            .stage-nav-btn.next-btn { right: 8px; }

            .thumb-card {
                flex: 0 0 100px;
            }
        }
    </style>
</head>
<body>
    <!-- TOPBAR HEADER -->
    <header class="slide-header">
        <div class="header-left">
            <a href="portal_v2.html" class="btn-back-hub" title="Quay lại Cổng Tri Thức LOCI EDU">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <span>Về Cổng Tri Thức</span>
            </a>
            <div class="slide-title-wrap">
                <div class="slide-main-title">
                    <span>Bài Giảng Cung Điện Ký Ức</span>
                    <span class="slide-tag">Chủ Đề 3</span>
                </div>
                <div class="slide-sub-title">Hệ thống 12 trạm Loci Lịch sử 12 chuẩn Nghiên Cứu Khoa Học</div>
            </div>
        </div>

        <div class="header-right">
            <div class="page-counter-pill">
                <span>Trang</span>
                <span id="current-slide-num">1</span>
                <span>/</span>
                <span>12</span>
            </div>

            <a href="assets/docs/Cung_Dien_Ky_Uc.pdf" download="Cung_Dien_Ky_Uc_Chu_De_3.pdf" class="btn-action-tool" title="Tải toàn bộ file PDF gốc bài giảng">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span>Tải PDF Gốc</span>
            </a>

            <button type="button" class="btn-action-tool btn-action-primary" id="btn-fullscreen" title="Xem toàn màn hình (Phím F)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
                <span>Toàn Màn Hình</span>
            </button>
        </div>
    </header>

    <!-- MAIN SLIDE DISPLAY -->
    <main class="presentation-area">
        <div class="slide-stage-card" id="slide-stage">
            <button type="button" class="stage-nav-btn prev-btn" id="btn-prev" aria-label="Slide trước">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>

            <!-- Picture element with WebP + JPG fallback for maximum fidelity and instant loading -->
            <picture id="slide-picture">
                <source id="source-webp" srcset="assets/slides/slide_01.webp" type="image/webp">
                <img id="main-slide-img" class="slide-image-element" src="assets/slides/slide_01.jpg" alt="Slide 1 - Cung Điện Ký Ức">
            </picture>

            <button type="button" class="stage-nav-btn next-btn" id="btn-next" aria-label="Slide tiếp theo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>

        <!-- CONTROLS & SHORTCUT HINTS -->
        <div class="slide-controls-bar">
            <div class="hotkey-hints">
                <span>Phím tắt:</span>
                <span class="kbd-key">◀</span>
                <span class="kbd-key">▶</span>
                <span>Chuyển trang</span>
                <span class="kbd-key">Space</span>
                <span>Tiếp</span>
                <span class="kbd-key">F</span>
                <span>Toàn màn hình</span>
                <span class="kbd-key">Esc</span>
                <span>Thoát</span>
            </div>

            <div class="progress-indicator-track" title="Tiến độ bài giảng">
                <div class="progress-indicator-fill" id="progress-bar"></div>
            </div>
        </div>
    </main>

    <!-- BOTTOM THUMBNAIL DOCK -->
    <div class="thumb-dock-wrap">
        <div class="thumb-strip-scroll" id="thumb-strip">
            <!-- 12 Slide Thumbnails generated dynamically by JS -->
        </div>
    </div>

    <script>
        (function() {
            const TOTAL_SLIDES = 12;
            let currentSlide = 1;

            const sourceWebp = document.getElementById('source-webp');
            const mainImg = document.getElementById('main-slide-img');
            const slideNumLabel = document.getElementById('current-slide-num');
            const progressBar = document.getElementById('progress-bar');
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const thumbStrip = document.getElementById('thumb-strip');
            const btnFullscreen = document.getElementById('btn-fullscreen');
            const slideStage = document.getElementById('slide-stage');

            // Preload cache for smooth instant transitions
            const preloadedImages = [];

            function getSlidePath(num, ext) {
                const pad = String(num).padStart(2, '0');
                return `assets/slides/slide_${pad}.${ext}`;
            }

            // Generate Thumbnails
            for (let i = 1; i <= TOTAL_SLIDES; i++) {
                const thumb = document.createElement('div');
                thumb.className = `thumb-card ${i === 1 ? 'active' : ''}`;
                thumb.dataset.slide = i;
                thumb.innerHTML = `
                    <picture>
                        <source srcset="${getSlidePath(i, 'webp')}" type="image/webp">
                        <img src="${getSlidePath(i, 'jpg')}" alt="Trang ${i}" loading="lazy">
                    </picture>
                    <span class="thumb-num">${i}</span>
                `;
                thumb.addEventListener('click', () => goToSlide(i));
                thumbStrip.appendChild(thumb);

                // Preload webp in background
                const img = new Image();
                img.src = getSlidePath(i, 'webp');
                preloadedImages.push(img);
            }

            function goToSlide(targetSlide) {
                if (targetSlide < 1) targetSlide = 1;
                if (targetSlide > TOTAL_SLIDES) targetSlide = TOTAL_SLIDES;
                currentSlide = targetSlide;

                // Update Image
                mainImg.classList.add('loading');
                sourceWebp.srcset = getSlidePath(currentSlide, 'webp');
                mainImg.src = getSlidePath(currentSlide, 'jpg');
                mainImg.alt = `Slide ${currentSlide} - Cung Điện Ký Ức`;

                setTimeout(() => {
                    mainImg.classList.remove('loading');
                }, 100);

                // Update UI elements
                slideNumLabel.textContent = currentSlide;
                progressBar.style.width = `${(currentSlide / TOTAL_SLIDES) * 100}%`;
                btnPrev.disabled = (currentSlide === 1);
                btnNext.disabled = (currentSlide === TOTAL_SLIDES);

                // Update Thumbnails
                const allThumbs = thumbStrip.querySelectorAll('.thumb-card');
                allThumbs.forEach(t => {
                    const isActive = parseInt(t.dataset.slide) === currentSlide;
                    t.classList.toggle('active', isActive);
                    if (isActive) {
                        t.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    }
                });
            }

            btnPrev.addEventListener('click', () => goToSlide(currentSlide - 1));
            btnNext.addEventListener('click', () => goToSlide(currentSlide + 1));

            // Keyboard navigation
            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                    e.preventDefault();
                    goToSlide(currentSlide - 1);
                } else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    goToSlide(currentSlide + 1);
                } else if (e.key === 'Home') {
                    e.preventDefault();
                    goToSlide(1);
                } else if (e.key === 'End') {
                    e.preventDefault();
                    goToSlide(TOTAL_SLIDES);
                } else if (e.key.toLowerCase() === 'f') {
                    e.preventDefault();
                    toggleFullscreen();
                }
            });

            // Touch Swipe navigation for mobile
            let touchStartX = 0;
            let touchEndX = 0;

            slideStage.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            slideStage.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });

            function handleSwipe() {
                const diff = touchEndX - touchStartX;
                if (Math.abs(diff) > 45) {
                    if (diff < 0) {
                        goToSlide(currentSlide + 1); // Swipe left -> Next
                    } else {
                        goToSlide(currentSlide - 1); // Swipe right -> Prev
                    }
                }
            }

            // Fullscreen Toggle
            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    slideStage.requestFullscreen().catch(err => {
                        console.warn('Error attempting to enable fullscreen:', err);
                    });
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            }

            btnFullscreen.addEventListener('click', toggleFullscreen);

            // Double click on stage to toggle fullscreen
            slideStage.addEventListener('dblclick', toggleFullscreen);

            // Initial view
            goToSlide(1);
        })();
    </script>
</body>
</html>
