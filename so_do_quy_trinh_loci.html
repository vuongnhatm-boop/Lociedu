<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sơ Đồ Quy Trình Học Tập Phương Pháp Loci - Loci Edu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #090c10;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 20, 29, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .title-group h1 {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: -0.3px;
    }

    .title-group p {
      font-size: 13px;
      color: #94a3b8;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: #f1f5f9;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #0369a1;
      border-color: #7dd3fc;
    }

    .viewer-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 20px;
      overflow: auto;
      background: #090c10;
      transition: background 0.3s ease;
    }

    .viewer-container.light-mode {
      background: #e2e8f0;
    }

    .image-wrapper {
      max-width: 100%;
      background: transparent;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: inline-block;
      transition: all 0.3s ease;
    }

    .image-wrapper img {
      display: block;
      max-width: 100%;
      height: auto;
      width: 1200px;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>SƠ ĐỒ QUY TRÌNH HỌC TẬP THEO PHƯƠNG PHÁP LOCI</h1>
      <p>Bản tái tạo độ nét cao 4K / Vector SVG chuẩn Nghiên cứu Khoa học</p>
    </div>

    <div class="toolbar">
      <a href="so_do_hoc_tap_loci.png" download="so_do_hoc_tap_loci_4k.png" class="btn btn-primary" id="downloadPng">
        Tải ảnh PNG (Độ phân giải 4K)
      </a>

      <a href="so_do_hoc_tap_loci.svg" download="so_do_hoc_tap_loci_vector.svg" class="btn" id="downloadSvg">
        Tải file Vector SVG
      </a>

      <a href="portal_v2.html" class="btn">
        Quay lại Portal
      </a>
    </div>
  </header>

  <main class="viewer-container light-mode" id="viewer">
    <div class="image-wrapper" id="imgWrapper">
      <img id="mainImage" src="so_do_hoc_tap_loci.png" alt="Sơ đồ quy trình học tập phương pháp Loci (Chữ đen chuẩn NCKH)">
    </div>
  </main>
</body>
</html>
