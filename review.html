                            <button type="button" onclick="window.ArenaDuelEngine ? window.ArenaDuelEngine.open() : (window.location.href='portal_v2.html#arena')" style="background: #0284c7; color: #fff; border: none; padding: 12px 18px; border-radius: 12px; font-weight: 800; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
                                <span>Vào Đua Ngay ➔</span>
                            </button>
                        </div>

                        <!-- CÚP LOCI (OLYMPIA) -->
                        <div style="background: linear-gradient(135deg, #fefce8, #ffffff); border: 1.5px solid #fef08a; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 8px 24px rgba(234, 179, 8, 0.1);">
                            <div>
                                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
                                    <span style="background: #eab308; color: #713f12; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 99px;">ĐẠI HỘI 4 NGƯỜI</span>
                                    <span style="font-size: 12px; font-weight: 800; color: #ca8a04;">+70 XP Vô Địch</span>
                                </div>
                                <h4 style="font-size: 17px; font-weight: 800; color: #0f172a; margin: 0 0 8px;">🏆 Cúp Loci (Olympia Lịch Sử)</h4>
                                <p style="font-size: 13px; color: #64748b; line-height: 1.5; margin: 0 0 16px;">
                                    Đại hội 4 vòng thi nghẹt thở: Khởi động, Vượt chướng ngại vật, Tăng tốc và Về đích. Giành Vòng nguyệt quế vinh quang và ghi tên lên Bảng Vàng.
                                </p>
                            </div>
                            <button type="button" onclick="window.OlympiaLociEngine ? window.OlympiaLociEngine.open() : (window.location.href='portal_v2.html#olympia')" style="background: #eab308; color: #713f12; border: none; padding: 12px 18px; border-radius: 12px; font-weight: 800; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
                                <span>Tham Gia Cúp Loci ➔</span>
                            </button>
                        </div>
                    </div>
                </div>

            `;

                // Chọn bài: kiểm tra khóa mở tuần tự theo quy chuẩn Loci
                root.querySelectorAll('.trio-tab-btn').forEach(btn => {
                    const targetLesson = btn.dataset.lesson;
                    const isLocked = btn.dataset.locked === 'true';
                    btn.onclick = () => {
                        if (isLocked) {
                            if (window.LociProgression && typeof window.LociProgression.showLockedModal === 'function') {
                                window.LociProgression.showLockedModal(targetLesson, (continueLesson) => {
                                    activeLessonFilter = continueLesson;
                                    home();
                                });
                            } else {
                                alert('Bài học này đang bị khóa. Bạn cần hoàn thành bài học trước đó theo đúng quy trình Loci!');
                            }
                            return;
                        }
                        if (activeLessonFilter === targetLesson) return;
                        activeLessonFilter = targetLesson;
                        home();
                    };
                });

                // Lắng nghe nút Đặt nhắc hẹn trên Web
                const btnReminder = document.getElementById('btn-open-reminder');
                if (btnReminder && window.LociReminder137) {
                    btnReminder.onclick = () => {
                        window.LociReminder137.openReminderModal();
                    };
                }


                // Lắng nghe nút Tiếp tục phiên tạm dừng
                const btnResume = document.getElementById('btn-resume-active');
                if (btnResume && savedSession) {
                    btnResume.onclick = () => {
                        resumeSession(savedSession);
                    };
                }
                const btnDiscard = document.getElementById('btn-discard-active');
                if (btnDiscard) {
                    btnDiscard.onclick = () => {
                        localStorage.removeItem('loci_saved_session');
                        home();
                    };
                }

                // Lắng nghe các nút bắt đầu luyện tập (Toàn bài / SM-2 / Từng hình thức / Đề thi)
                root.querySelectorAll('[data-action]').forEach(btn => {
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        const action = btn.dataset.action;
                                                if (action === 'olympia') {
                            if (window.OlympiaLociEngine) {
                                window.OlympiaLociEngine.open();
                            } else {
                                window.location.href = 'game_duong_len_dinh_loci.html';
                            }
                            return;
                        }
                        if (action === 'arena') {
                            if (window.ArenaDuelEngine) {
                                window.ArenaDuelEngine.open();
                            } else {
                                alert('Đang khởi tạo Đấu Trường Tri Thức, vui lòng thử lại sau giây lát!');
                            }
                            return;
                        }
                        if (action === 'model3d') {
                            const curLesson = (currentData && currentData.lesson && currentData.lesson.id) || activeLessonFilter || 'bai_6';
                            if (window.LociModel3DExam) {
                                window.LociModel3DExam.start(curLesson, root, () => home());
                            } else {
                                alert('Đang tải mô-đun Kiểm tra Mô hình 3D, vui lòng thử lại sau giây lát!');
                            }
                            return;
                        }
                        if (action === 'exam') {
                            const curLesson = (currentData && currentData.lesson && currentData.lesson.id) || activeLessonFilter || 'all';
                            const param = curLesson && curLesson !== 'all' ? `?lesson=${encodeURIComponent(curLesson)}` : '';
                            window.location.href = `de_thi.html${param}`;
                            return;
                        }
                        const format = btn.dataset.format || 'all';
                        start(currentData, action, format);
                    };
                });
            }

            function resumeSession(saved) {
                const lessonData = rawLessons.find(r => r.lesson.id === saved.lessonId);
                if (!lessonData) return;
                start(lessonData, saved.mode, saved.typeFilter, saved);
            }

            function start(x, mode = 'all', typeFilter = 'all', resumeState = null) {
                let list = mode === 'due' ? (x.qs || []).filter(q => engine.isDue(q.id)) : x.qs;
                if (typeFilter && typeFilter !== 'all') {
                    list = list.filter(q => q.type === typeFilter);
                }
                if (!list || list.length === 0) {
                    list = x.qs.filter(q => (typeFilter && typeFilter !== 'all') ? q.type === typeFilter : true);
                }

                // Nếu tiếp tục phiên trước
                let idx = 0;
                const stat = {
                    total: list.length,
                    good: 0,
                    wrong: 0,
                    byType: {},
                    wrongQuestions: []
                };

                if (resumeState) {
                    list = resumeState.list && resumeState.list.length ? resumeState.list : list;
                    idx = resumeState.idx || 0;
                    stat.good = resumeState.good || 0;
                    stat.wrong = resumeState.wrong || 0;
                    stat.byType = resumeState.byType || {};
                    stat.wrongQuestions = resumeState.wrongQuestions || [];
                } else {
                    list = shuffle(list);
                }

                const top = () => `
                <div class="session-top">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="font-weight:800; font-size:15px; color:var(--text-main);">${esc(x.lesson.title)}</span>
                        <span class="session-badge">Câu ${idx + 1}/${list.length}</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:12px;">
                        <span style="font-size:13px; font-weight:700; color:var(--ok); display:inline-flex; align-items:center; gap:4px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> ${stat.good} đúng</span>
                        <span style="font-size:13px; font-weight:700; color:var(--bad); display:inline-flex; align-items:center; gap:4px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> ${stat.wrong} sai</span>
                        <button id="quit" class="session-quit-btn" title="Dừng và lưu tiến trình">Tạm dừng</button>
                    </div>
                </div>
                <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${list.length}" aria-valuenow="${idx}">
                    <i style="width:${idx / list.length * 100}%"></i>
                </div>`;

                function saveCurrentState() {
                    try {
                        const sessionData = {
                            lessonId: x.lesson.id,
                            mode,
                            typeFilter,
                            idx,
                            total: list.length,
                            good: stat.good,
                            wrong: stat.wrong,
                            byType: stat.byType,
                            wrongQuestions: stat.wrongQuestions,
                            list: list,
                            savedAt: Date.now()
                        };
                        localStorage.setItem('loci_saved_session', JSON.stringify(sessionData));
                    } catch (e) { }
                }

                function next() {
                    window.onkeydown = null;
                    idx++;
                    saveCurrentState(); // Tự động lưu tiến trình từng câu!
                    idx >= list.length ? finish() : show();
                }

                function recordRate(score, userDetail = null) {
                    const q = list[idx];
                    stat.byType[q.type] = (stat.byType[q.type] || 0) + 1;
                    engine.processReview(q.id, score);

                    if (score >= 3) {
                        stat.good++;
                    } else {
                        stat.wrong++;

                        const promptText = q.type === 'typein' ? q.data.prompt :
                            q.type === 'cloze' ? q.data.sentence :
                                q.type === 'quiz' ? q.data.question : q.data.front;
                        const correctText = q.type === 'typein' ? q.data.answer :
                            q.type === 'cloze' ? q.data.blank :
                                q.type === 'quiz' ? q.data.options[q.data.correct] : q.data.back;
                        const hintText = q.data.hint || q.data.explanation || q.data.mnemonic || q.data.fullText || '';

                        stat.wrongQuestions.push({
                            id: q.id,
                            qObj: q,
                            type: q.type,
                            prompt: promptText,
                            userAnswer: userDetail || '(Chưa nhớ)',
                            correctAnswer: correctText,
                            hint: hintText
                        });
                    }
                    next();
                }

                function openPauseModal() {
                    window.onkeydown = null;
                    const existing = document.getElementById('pauseModal');
                    if (existing) existing.remove();

                    const modal = document.createElement('div');
                    modal.className = 'pause-modal-overlay';
                    modal.id = 'pauseModal';
                    modal.innerHTML = `
                    <div class="pause-modal-box">
                        <div style="width:52px; height:52px; border-radius:50%; background:#e0f2fe; color:#0284c7; display:grid; place-items:center; margin:0 auto 12px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg></div>
                        <h3 style="font-size:20px; font-weight:800; color:var(--text-main); margin-bottom:6px;">
                            Tạm dừng & Ghi nhận tiến trình
                        </h3>
                        <p style="font-size:13.5px; color:var(--text-muted); margin-bottom:20px; line-height:1.5;">
                            Bạn đang ở <b>câu ${idx + 1}/${list.length}</b> (${stat.good} đúng · ${stat.wrong} sai).<br>
                            Toàn bộ tiến trình sẽ được lưu lại nguyên vẹn!
                        </p>
                        <div style="display:flex; flex-direction:column; gap:10px;">
                            <button class="btn-modal-action pri" id="btn-modal-save">
                                Lưu tiến trình & Tạm nghỉ
                            </button>
                            ${idx > 0 ? `
                            <button class="btn-modal-action sec" id="btn-modal-early-finish">
                                Xem kết quả các câu đã làm
                            </button>` : ''}
                            <button class="btn-modal-action ghost" id="btn-modal-continue">
                                Tiếp tục làm câu này ➔
                            </button>
                        </div>
                    </div>`;

                    document.body.appendChild(modal);

                    document.getElementById('btn-modal-save').onclick = () => {
                        saveCurrentState();
                        modal.remove();
                        home();
                    };

                    const earlyBtn = document.getElementById('btn-modal-early-finish');
                    if (earlyBtn) {
                        earlyBtn.onclick = () => {
                            modal.remove();
                            localStorage.removeItem('loci_saved_session');
                            finish(true);
                        };
                    }

                    document.getElementById('btn-modal-continue').onclick = () => {
                        modal.remove();
                        show();
                    };
                } function show() {
                    const q = list[idx];

                    // ══════════════════════════════════════════════════════
                    // 1. DẠNG GÕ ĐÁP ÁN CHÍNH XÁC (TYPE-IN ANSWER)
                    // ══════════════════════════════════════════════════════
                    if (q.type === 'typein') {
                        root.innerHTML = top() + `
                        <div class="kind typein">GÕ ĐÁP ÁN CHÍNH XÁC</div>
                        <p class="q">${esc(q.data.prompt)}</p>
                        ${q.data.hint ? `<p class="typein-hint"><b style="color:var(--primary);">Gợi ý:</b> ${esc(q.data.hint)}</p>` : ''}
                        
                        <div class="typein-box" id="typein-box">
                            <input type="text" id="typein-input" class="typein-input" placeholder="Gõ câu trả lời chính xác bằng bàn phím..." autocomplete="off" spellcheck="false" autofocus />
                            <button class="btn" id="typein-submit">Kiểm tra ↵</button>
                        </div>
                        <div id="slot"></div>`;

                        const inp = document.getElementById('typein-input');
                        const sub = document.getElementById('typein-submit');
                        const slot = document.getElementById('slot');

                        function handleCheck() {
                            const val = inp.value.trim();
                            inp.disabled = true;
                            sub.disabled = true;

                            const checker = window.LociFlashcardFormats?.checkTypeInAnswer;
                            const res = checker
                                ? checker(val, q.data.answer, q.data.accepted || [], q.data.hint || '')
                                : { score: 100, status: 'exact', title: 'Hoàn tất', typed: val, target: q.data.answer, recommendedGrade: 5 };

                            const isCorrectAnswer = res.recommendedGrade >= 3;
                            slot.innerHTML = `
                            <div class="typein-result">
                                <div class="typein-badge ${res.status}">${res.title} (Khớp ${res.score}%)</div>
                                <div class="typein-row yours">
                                    <b>Câu bạn đã gõ:</b>
                                    <span class="is-${res.status}">${esc(res.typed || '(Chưa gõ)')}</span>
                                </div>
                                <div class="typein-row target">
                                    <b>Đáp án chuẩn:</b>
                                    <span>${esc(res.target)}</span>
                                </div>
                            </div>
                            <div style="display:flex; flex-direction:column; gap:10px; align-items:center; margin-top:16px;">
                                <button class="btn btn-highlight" id="btn-typein-continue" style="min-width:240px; padding:12px 28px; font-size:15px;">
                                    ${isCorrectAnswer ? 'Tiếp tục (Đúng +1) ➔' : 'Tiếp tục (Cần ôn lại) ➔'}
                                </button>
                                ${isCorrectAnswer ? `
                                <button class="btn-text-subtle" id="btn-typein-self-review" style="font-size:12px; color:var(--text-muted); background:none; border:none; cursor:pointer; text-decoration:underline;">
                                    Tôi muốn đánh dấu ôn lại câu này ngày mai
                                </button>` : ''}
                            </div>`;

                            const continueBtn = document.getElementById('btn-typein-continue');
                            const selfReviewBtn = document.getElementById('btn-typein-self-review');

                            function goNextTypein(forcedWrong = false) {
                                window.onkeydown = null;
                                if (forcedWrong) {
                                    recordRate(1, val);
                                } else {
                                    recordRate(isCorrectAnswer ? 5 : 1, val);
                                }
                            }

                            continueBtn.onclick = () => goNextTypein(false);
                            if (selfReviewBtn) selfReviewBtn.onclick = () => goNextTypein(true);

                            window.onkeydown = (e) => {
                                if (e.key === 'Enter') {
                                    e.preventDefault();
                                    goNextTypein(false);
                                }
                            };
                        }

                        sub.onclick = handleCheck;
                        inp.onkeydown = e => { if (e.key === 'Enter') handleCheck(); };
                    }

                    // ══════════════════════════════════════════════════════
                    // 2. DẠNG ĐIỀN KHUYẾT TRONG NGỮ CẢNH (CLOZE DELETION)
                    // ══════════════════════════════════════════════════════
                    else if (q.type === 'cloze') {
                        const blankDisplay = `<span class="cloze-blank" id="cloze-mark" title="Nhấn để lật mở đáp án">[ ... ]</span>`;
                        const sentenceHtml = esc(q.data.sentence).replace(/\[BLANK\]/g, blankDisplay);

                        root.innerHTML = top() + `
                        <div class="kind cloze">ĐIỀN KHUYẾT NGỮ CẢNH</div>
                        <div class="cloze-card">
                            <div class="cloze-sentence">${sentenceHtml}</div>
                            <div id="cloze-actions" style="display:flex; gap:10px; flex-wrap:wrap;">
                                <button class="btn" id="cloze-reveal">Hiện từ bị ẩn</button>
                                <button class="btn ghost" id="cloze-try-btn">Thử tự gõ từ khuyết</button>
                            </div>
                            <div id="cloze-try-box" style="display:none; margin-top:16px; gap:10px;">
                                <input type="text" id="cloze-inp" class="typein-input" placeholder="Nhập từ bị khuyết..." />
                                <button class="btn" id="cloze-check-btn">Kiểm tra</button>
                            </div>
                        </div>
                        <div id="slot"></div>`;

                        const mark = document.getElementById('cloze-mark');
                        const actions = document.getElementById('cloze-actions');
                        const tryBox = document.getElementById('cloze-try-box');

                        function revealCloze(typedAnswer = null) {
                            actions.style.display = 'none';
                            tryBox.style.display = 'none';
                            if (mark) {
                                mark.textContent = q.data.blank;
                                mark.classList.add('revealed');
                            }

                            let matchHtml = '';
                            let suggestedGrade = 5;

                            if (typedAnswer !== null) {
                                const checker = window.LociFlashcardFormats?.checkTypeInAnswer;
                                const res = checker
                                    ? checker(typedAnswer, q.data.blank, [q.data.blank])
                                    : { status: 'exact', score: 100, title: 'Hoàn tất', recommendedGrade: 5 };

                                suggestedGrade = res.recommendedGrade;
                                matchHtml = `
                                <div class="typein-result" style="margin-top:16px;">
                                    <div class="typein-badge ${res.status}">${res.title}</div>
                                    <div class="typein-row yours"><b>Bạn đã đoán:</b> <span class="is-${res.status}">${esc(typedAnswer)}</span></div>
                                    <div class="typein-row target"><b>Từ chính xác:</b> <span>${esc(q.data.blank)}</span></div>
                                </div>`;
                            }

                            const isCorrectCloze = suggestedGrade >= 3;
                            const slot = document.getElementById('slot');
                            slot.innerHTML = `
                            ${matchHtml}
                            <div class="answer" style="margin-top:14px; border-left: 4px solid #38bdf8;">
                                <b>Ngữ cảnh đầy đủ:</b>
                                <div style="font-size:16px; line-height:1.6; margin-top:6px; color:#1e293b;">
                                    ${esc(q.data.fullText || q.data.sentence.replace('[BLANK]', q.data.blank))}
                                </div>
                            </div>
                            <div style="display:flex; justify-content:center; margin-top:16px;">
                                <button class="btn btn-highlight" id="btn-cloze-next" style="min-width:240px; padding:12px 28px; font-size:15px;">
                                    ${isCorrectCloze ? 'Tiếp tục (Chính xác +1) ➔' : 'Tiếp tục (Cần ôn lại) ➔'}
                                </button>
                            </div>`;

                            const clozeNextBtn = document.getElementById('btn-cloze-next');
                            function advanceCloze() {
                                window.onkeydown = null;
                                recordRate(isCorrectCloze ? 5 : 1, typedAnswer);
                            }
                            clozeNextBtn.onclick = advanceCloze;
                            window.onkeydown = (e) => {
                                if (e.key === 'Enter' || e.code === 'Space') {
                                    e.preventDefault();
                                    advanceCloze();
                                }
                            };
                        }

                        document.getElementById('cloze-reveal').onclick = () => revealCloze(null);
                        if (mark) mark.onclick = () => revealCloze(null);

                        document.getElementById('cloze-try-btn').onclick = () => {
                            actions.style.display = 'none';
                            tryBox.style.display = 'flex';
                            const cinp = document.getElementById('cloze-inp');
                            cinp.focus();
                            document.getElementById('cloze-check-btn').onclick = () => revealCloze(cinp.value.trim());
                            cinp.onkeydown = e => { if (e.key === 'Enter') revealCloze(cinp.value.trim()); };
                        };
                    }

                    // ══════════════════════════════════════════════════════
                    // 3 & 4. DẠNG FLASHCARD & ĐẢO CHIỀU (FLIP ON CLICK HOẶC SPACE)
                    // ══════════════════════════════════════════════════════
                    else if (q.type === 'reversed' || q.type === 'fc') {
                        const isRev = q.type === 'reversed';
                        const badgeText = isRev ? 'TRUY VẤN ĐẢO HAI CHIỀU' : 'THẺ NHỚ FLASHCARD';
                        const badgeClass = isRev ? 'reversed' : '';

                        root.innerHTML = top() + `
                        <div class="flip-card-stage" id="flipCardStage" tabindex="0">
                            <div class="flip-card-inner" id="flipCardInner">
                                <!-- MẶT TRƯỚC (FRONT) -->
                                <div class="flip-card-front">
                                    <div class="flip-card-header">
                                        <span class="flip-card-badge ${badgeClass}">${badgeText}</span>
                                        <span class="flip-hint-badge">Nhấn [Phím cách] hoặc chạm thẻ để lật</span>
                                    </div>
                                    <div class="flip-card-body">
                                        <div class="flip-card-prompt">${esc(q.data.front)}</div>
                                    </div>
                                    <div class="flip-card-footer">
                                        <span class="flip-click-cta">Chạm thẻ để xem đáp án</span>
                                        <span style="font-size:12px; font-weight:700; color:var(--primary);">Space ↵</span>
                                    </div>
                                </div>

                                <!-- MẶT SAU (BACK) -->
                                <div class="flip-card-back">
                                    <div class="flip-card-header">
                                        <span class="flip-card-badge success">ĐÁP ÁN CHÍNH XÁC</span>
                                        <span class="flip-hint-badge">Nhấn [Phím cách] để lật lại mặt trước</span>
                                    </div>
                                    <div class="flip-card-body">
                                        <div class="flip-card-answer">${esc(q.data.back)}</div>
                                        ${q.data.mnemonic ? `
                                        <div class="flip-card-mnemonic">
                                            <b style="color:#b45309;">Mẹo nhớ Loci:</b> ${esc(q.data.mnemonic)}
                                        </div>` : ''}
                                    </div>
                                    <div class="flip-card-footer">
                                        <span class="flip-click-cta">Đã mở đáp án · Vui lòng chọn mức độ nhớ bên dưới:</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- KHU VỰC ĐÁNH GIÁ (RATE SM-2) -->
                        <div id="rateBox" style="opacity:0; pointer-events:none; transition:opacity 0.25s ease;">
                            <p style="font-size:13px; font-weight:700; color:var(--text-muted); margin-bottom:8px; text-align:center;">
                                Đánh giá mức độ ghi nhớ theo thuật toán SM-2: <small>[Phím 1, 3, 5]</small>
                            </p>
                            <div class="rate">
                                <button class="btn ghost" data-q="1">Chưa nhớ<small>[Phím 1] · ôn lại ngày mai</small></button>
                                <button class="btn ghost" data-q="3">Nhớ mang máng<small>[Phím 3] · ôn sớm</small></button>
                                <button class="btn" data-q="5">Nhớ chuẩn<small>[Phím 5 hoặc Enter] · giãn lịch</small></button>
                            </div>
                        </div>
                    `;

                        const stage = document.getElementById('flipCardStage');
                        const rateBox = document.getElementById('rateBox');
                        let isFlipped = false;

                        function doFlip() {
                            isFlipped = !isFlipped;
                            if (isFlipped) {
                                stage.classList.add('is-flipped');
                                rateBox.style.opacity = '1';
                                rateBox.style.pointerEvents = 'auto';
                            } else {
                                stage.classList.remove('is-flipped');
                            }
                        }

                        // 1. Nhấp trực tiếp vào thẻ để lật
                        stage.onclick = doFlip;

                        // 2. Bấm phím cách (Spacebar) hoặc phím tắt số 1, 3, 5
                        window.onkeydown = function (e) {
                            if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;

                            // Phím cách: Lật thẻ
                            if (e.code === 'Space' || e.key === ' ') {
                                e.preventDefault();
                                doFlip();
                                return;
                            }

                            // Khi đã lật: hỗ trợ phím số đánh giá
                            if (isFlipped) {
                                if (e.key === '1') {
                                    window.onkeydown = null;
                                    recordRate(1);
                                } else if (e.key === '2' || e.key === '3') {
                                    window.onkeydown = null;
                                    recordRate(3);
                                } else if (e.key === '4' || e.key === '5' || e.key === 'Enter') {
                                    window.onkeydown = null;
                                    recordRate(5);
                                }
                            }
                        };

                        rateBox.querySelectorAll('[data-q]').forEach(b => {
                            b.onclick = (e) => {
                                e.stopPropagation();
                                window.onkeydown = null;
                                recordRate(+b.dataset.q);
                            };
                        });
                    }

                    // ══════════════════════════════════════════════════════
                    // 5. DẠNG TRẮC NGHIỆM (QUIZ)
                    // ══════════════════════════════════════════════════════
                    else {
                        root.innerHTML = top() + `
                        <div class="kind quiz">TRẮC NGHIỆM PHÂN BIỆT</div>
                        <p class="q">${esc(q.data.question)}</p>
                        <div class="opts">${q.data.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>
                        <div id="slot"></div>`;

                        document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
                            const pick = +b.dataset.i, ok = pick === q.data.correct;
                            document.querySelectorAll('.opt').forEach(o => o.disabled = true);
                            b.classList.add(ok ? 'right' : 'wrong');
                            if (!ok) {
                                const rightBtn = document.querySelector(`.opt[data-i="${q.data.correct}"]`);
                                if (rightBtn) rightBtn.classList.add('right');
                            }

                            if (ok) {
                                document.getElementById('slot').innerHTML = `
                                <div class="answer" style="border-left: 4px solid #10b981; background: rgba(16, 185, 129, 0.08);">
                                    <b style="color: #10b981; font-size:15px;">Chính xác xuất sắc! (+1 Điểm)</b>
                                    ${q.data.explanation ? `<div style="margin-top:6px; color:#1e293b;">${esc(q.data.explanation)}</div>` : ''}
                                </div>
                                <div style="display:flex; justify-content:center; margin-top:16px;">
                                    <button class="btn btn-highlight" id="btn-quiz-next" style="min-width:240px; padding:12px 28px; font-size:15px;">
                                        Tiếp tục (Chính xác) ➔
                                    </button>
                                </div>`;

                                const quizNextBtn = document.getElementById('btn-quiz-next');
                                function advanceQuiz() {
                                    window.onkeydown = null;
                                    recordRate(5, q.data.options[pick]);
                                }
                                quizNextBtn.onclick = advanceQuiz;
                                window.onkeydown = (e) => {
                                    if (e.key === 'Enter' || e.code === 'Space') {
                                        e.preventDefault();
                                        advanceQuiz();
                                    }
                                };
                            } else {
                                document.getElementById('slot').innerHTML = `
                                <div class="answer" style="border-left: 4px solid #ef4444; background: rgba(239, 68, 68, 0.08);">
                                    <b style="color: #ef4444; font-size:15px;">Chưa chính xác</b>
                                    <div style="margin-top:6px; font-weight:700; color:#1e293b;">Đáp án đúng là: <span style="color:#059669; background:#ecfdf5; padding:2px 8px; border-radius:6px;">${esc(q.data.options[q.data.correct])}</span></div>
                                    ${q.data.explanation ? `<div style="margin-top:6px; color:#64748b; font-size:13.5px;">${esc(q.data.explanation)}</div>` : ''}
                                </div>
                                <div style="display:flex; justify-content:center; margin-top:16px;">
                                    <button class="btn ghost btn-highlight" id="btn-quiz-next" style="min-width:240px; padding:12px 28px; font-size:15px;">
                                        Tiếp tục (Cần ôn lại câu này) ➔
                                    </button>
                                </div>`;

                                const quizNextBtn = document.getElementById('btn-quiz-next');
                                function advanceQuiz() {
                                    window.onkeydown = null;
                                    recordRate(1, q.data.options[pick]);
                                }
                                quizNextBtn.onclick = advanceQuiz;
                                window.onkeydown = (e) => {
                                    if (e.key === 'Enter' || e.code === 'Space') {
                                        e.preventDefault();
                                        advanceQuiz();
                                    }
                                };
                            }
                        });
                    }

                    const quit = document.getElementById('quit');
                    if (quit) quit.onclick = openPauseModal;
                }

                function finish(isEarly = false) {
                    localStorage.removeItem('loci_saved_session'); // Đã hoàn thành nên giải phóng session dở
                    const actualTotal = isEarly ? Math.max(idx, 1) : stat.total;
                    const percent = Math.round(stat.good / actualTotal * 100) || 0;

                    // Lưu tiến trình vào localStorage
                    try {
                        const prog = JSON.parse(localStorage.getItem('loci_lesson_progress') || '{}');
                        prog[x.lesson.id] = {
                            percent: percent,
                            good: stat.good,
                            wrong: stat.wrong,
                            total: stat.total,
                            updatedAt: Date.now()
                        };
                        localStorage.setItem('loci_lesson_progress', JSON.stringify(prog));
                    } catch (e) { }

                    // Ghi nhận hoàn thành mốc chu kỳ 1-3-7
                    try {
                        if (window.LociReminder137 && percent >= 50) {
                            window.LociReminder137.recordLessonCompleted(x.lesson.id, percent);
                        }
                    } catch (e) { }

                    // Ghi nhận vào hệ thống mở khóa tuần tự LociProgression
                    try {
                        if (window.LociProgression) {
                            window.LociProgression.recordFlashcardReviewed(x.lesson.id);
                            if (actualTotal >= 5) {
                                window.LociProgression.recordQuizScore(x.lesson.id, percent);
                            }
                        }
                    } catch (e) { }

                    function formatLabel(type) {
                        const map = {
                            typein: 'Gõ đáp án',
                            cloze: 'Điền khuyết',
                            reversed: 'Đảo chiều',
                            fc: 'Flashcard',
                            quiz: 'Trắc nghiệm'
                        };
                        return map[type] || 'Câu hỏi';
                    }

                    root.innerHTML = `
                    <div class="results-container">
                        <!-- HEADER TỔNG KẾT -->
                        <div style="text-align:center; padding:10px 0 6px;">
                            <div style="width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg, #e0f2fe 0%, #ecfdf5 100%); border:2px solid #bae6fd; color:#0284c7; display:grid; place-items:center; margin:0 auto 12px;">
                                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.45 1-1 1H7v2h10v-2h-2c-.55 0-1-.45-1-1v-2.34"/><path d="M18 4H6v7a6 6 0 0 0 12 0V4z"/></svg>
                            </div>
                            <h2 style="font-size:24px; font-weight:800; color:var(--text-main); margin-bottom:4px;">
                                ${percent >= 80 ? 'Xuất sắc! Nắm rất vững kiến thức' : percent >= 50 ? 'Hoàn thành tốt lượt ôn tập!' : 'Cần củng cố thêm các mốc quan trọng'}
                            </h2>
                            <p class="lede" style="margin-bottom:0; font-size:14px;">
                                ${esc(x.lesson.title)} · Thuật toán SM-2 đã cập nhật dữ liệu
                            </p>
                        </div>

                        <!-- 4 Ô TIẾN TRÌNH & KẾT QUẢ -->
                        <div class="results-stats-grid">
                            <div class="stat-box">
                                <div class="stat-val" style="color:var(--primary);">${percent}%</div>
                                <div class="stat-label">Tỷ lệ chính xác</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-val" style="color:var(--ok);">${stat.good}</div>
                                <div class="stat-label">Số câu đúng</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-val" style="color:var(--bad);">${stat.wrong}</div>
                                <div class="stat-label">Số câu sai</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-val" style="color:#0284c7;">${isEarly ? Math.round(actualTotal / stat.total * 100) + '%' : '100%'}</div>
                                <div class="stat-label">${isEarly ? 'Hoàn thành (' + actualTotal + '/' + stat.total + ')' : 'Tiến trình (' + stat.total + '/' + stat.total + ')'}</div>
                            </div>
                        </div>

                        <!-- CHI TIẾT "SAI Ở ĐÂU" -->
                        ${stat.wrongQuestions.length > 0 ? `
                        <div class="wrong-review-card">
                            <div class="wrong-review-header">
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                                    <div>
                                        <div style="font-size:15.5px; font-weight:800; color:var(--text-main);">
                                            Chi tiết câu sai & Cần ôn lại (${stat.wrongQuestions.length} câu)
                                        </div>
                                        <div style="font-size:12.5px; color:var(--text-muted);">
                                            Đối chiếu câu bạn đã trả lời với đáp án chuẩn và mẹo Loci
                                        </div>
                                    </div>
                                </div>
                                <button class="btn-retry-wrong" id="retry-wrong-top-btn">
                                    Ôn lại ${stat.wrongQuestions.length} câu sai
                                </button>
                            </div>

                            <div class="wrong-list">
                                ${stat.wrongQuestions.map((wq, i) => `
                                <div class="wrong-item">
                                    <div class="wrong-item-num">Câu ${i + 1} · ${formatLabel(wq.type)}</div>
                                    <div class="wrong-item-q">${esc(wq.prompt)}</div>
                                    
                                    <div class="wrong-item-comparison">
                                        <div class="wrong-ans-row wrong">
                                            <span class="wrong-tag">Bạn đã trả lời:</span>
                                            <span class="wrong-text">${esc(wq.userAnswer)}</span>
                                        </div>
                                        <div class="wrong-ans-row right">
                                            <span class="right-tag">Đáp án chính xác:</span>
                                            <span class="right-text">${esc(wq.correctAnswer)}</span>
                                        </div>
                                    </div>

                                    ${wq.hint ? `
                                    <div class="wrong-item-hint">
                                        <b>Mẹo nhớ Loci:</b> ${esc(wq.hint)}
                                    </div>` : ''}
                                </div>`).join('')}
                            </div>
                        </div>` : `
                        <div class="perfect-score-card">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="20 6 9 17 4 12"/></svg>
                            <div>
                                <div style="font-weight:800; font-size:16px; color:#065f46;">Hoàn hảo! Không có câu nào trả lời sai</div>
                                <div style="font-size:13.5px; color:#047857;">Bạn đã ghi nhớ trọn vẹn toàn bộ kiến thức trong phiên ôn tập này.</div>
                            </div>
                        </div>`}

                        <!-- HÀNH ĐỘNG TIẾP THEO -->
                        <div class="results-actions">
                            ${stat.wrongQuestions.length > 0 ? `
                            <button class="btn-action-highlight" id="btn-practice-wrong">
                                Ôn lại riêng ${stat.wrongQuestions.length} câu sai ngay ➔
                            </button>` : ''}
                            <button class="btn-action-norm" id="btn-goto-exam" style="background: linear-gradient(135deg, #ecfdf5, #d1fae5); border-color: #a7f3d0; color: #047857; font-weight:700;">
                                Làm Đề ôn tập (${x.lesson ? x.lesson.title : 'bài này'}) ➔
                            </button>
                            <button class="btn-action-norm" id="btn-retry-all">
                                Luyện lại toàn bài
                            </button>
                            <button class="btn-action-norm" id="btn-back-home">
                                Trở về danh sách bài
                            </button>
                        </div>
                    </div>`;

                    // Nút ôn lại riêng các câu sai
                    const retryWrongTop = document.getElementById('retry-wrong-top-btn');
                    const practiceWrong = document.getElementById('btn-practice-wrong');
                    function startRetryWrong() {
                        const customLesson = {
                            lesson: x.lesson,
                            qs: stat.wrongQuestions.map(w => w.qObj),
                            due: []
                        };
                        start(customLesson, 'all', 'all');
                    }
                    if (retryWrongTop) retryWrongTop.onclick = startRetryWrong;
                    if (practiceWrong) practiceWrong.onclick = startRetryWrong;

                    // Nút luyện lại toàn bộ
                    document.getElementById('btn-retry-all').onclick = () => start(x, 'all', typeFilter);

                    // Nút làm đề thi THPT
                    const btnGotoExam = document.getElementById('btn-goto-exam');
                    if (btnGotoExam) {
                        btnGotoExam.onclick = () => {
                            const lid = x.lesson ? x.lesson.id : '';
                            window.location.href = `de_thi.html${lid ? '?lesson=' + encodeURIComponent(lid) : ''}`;
                        };
                    }

                    // Nút về trang chủ
                    document.getElementById('btn-back-home').onclick = home;
                }

                show();
            }

            // Bắt đầu khởi tạo giao diện
            window.addEventListener('loci:auth:change', () => home());
            home();
        })();
    </script>
</body>

</html>
